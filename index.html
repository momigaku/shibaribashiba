<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シバリバーシバ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/*
VOICE: やわらかく、ほっこり。おうちで柴犬と遊ぶ午後。
IDEA: リビングのソファー前に置いた木のリバーシ盤。
PICTURE: 窓から日が差すリビングの全面イラスト＋中央の盤／タイトルカード。
COLOUR and TYPE: 壁のクリーム、木の淡い茶、濃い焦げ茶の縁、白い線。Zen Maru Gothic。
LAYOUT: タイトル→盤→スコア・操作。広い画面では盤の左右にスコア。
*/
:root{color-scheme:light;--ink:#4a2f1d;--card:rgba(255,248,236,.92);--line:#fff;--board:#e3c497;--accent:#e0782f}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.55 "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;overflow-x:clip;background:#efd9b8}
#room{position:fixed;inset:0;width:100%;height:100%;z-index:0}
:root{--sky1:#8fcbf0;--sky2:#cfeaf7;--sky3:#f3f7e8;--hill1:#a9cf8e;--hill2:#8dbb74;--beam:#fff3c9;--shade:#000;--shadeOp:0;--lamp:.55}
:root[data-scene=morning]{--sky1:#ffcdbd;--sky2:#ffe4c9;--sky3:#fff1d2;--hill1:#b8d99a;--hill2:#9cc683;--beam:#ffe2c2;--lamp:.4}
:root[data-scene=night]{--sky1:#141b45;--sky2:#25306a;--sky3:#3d4886;--hill1:#2f3f63;--hill2:#243251;--beam:#c9d3ff;--shade:#18204d;--shadeOp:.48;--lamp:1}
:root[data-scene=space]{--sky1:#05031a;--sky2:#160c3a;--sky3:#2a1656;--beam:#c8a6ff;--shade:#140a36;--shadeOp:.55;--lamp:1}
#room .sc-morning,#room .sc-night,#room .sc-space{display:none}
:root[data-scene=morning] #room .sc-morning,:root[data-scene=night] #room .sc-night,:root[data-scene=space] #room .sc-space{display:inline}
:root[data-scene=morning] #room .sc-noon,:root[data-scene=night] #room .sc-noon,:root[data-scene=space] #room .sc-noon,:root[data-scene=space] #room .sc-hills{display:none}
#dancer{position:fixed;left:0;top:0;width:150px;height:190px;z-index:50;pointer-events:none;will-change:transform}
#dancer .hop{position:absolute;inset:0;animation:hop .5s ease-in-out infinite alternate}
#dancer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#dancer .face{position:absolute;left:25px;top:0;width:100px;height:100px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));animation:tilt .5s ease-in-out infinite alternate}
#dancer .armL{transform-origin:52px 112px;animation:shakeL .25s ease-in-out infinite alternate}
#dancer .armR{transform-origin:98px 112px;animation:shakeR .25s ease-in-out infinite alternate}
#dancer .legL{transform-origin:62px 150px;animation:legs .5s ease-in-out infinite alternate}
#dancer .legR{transform-origin:88px 150px;animation:legs .5s ease-in-out infinite alternate-reverse}
#dancer .note{position:absolute;font:900 26px "Zen Maru Gothic",sans-serif;color:var(--accent);text-shadow:0 2px 0 #fff;animation:note 1.6s ease-out infinite}
#wdance{position:relative;margin:0 auto 4px;height:clamp(120px,26vh,220px)}
#wdance img{position:absolute;inset:0;width:100%;height:100%;user-select:none}
#wdance .body{filter:drop-shadow(0 6px 8px rgba(60,30,10,.3))}
#wdance .tail{animation:wag .1s ease-in-out infinite alternate}
#wdance .note{position:absolute;font:900 24px "Zen Maru Gothic",sans-serif;color:var(--accent);text-shadow:0 2px 0 #fff;animation:note 1.6s ease-out infinite}
@keyframes wag{from{transform:translateX(-2.5%) rotate(-9deg)}to{transform:translateX(2.5%) rotate(9deg)}}
@keyframes hop{from{translate:0 0;rotate:-6deg}to{translate:0 -18px;rotate:6deg}}
@keyframes tilt{from{rotate:-8deg}to{rotate:8deg}}
@keyframes shakeL{from{transform:rotate(-30deg)}to{transform:rotate(15deg)}}
@keyframes shakeR{from{transform:rotate(30deg)}to{transform:rotate(-15deg)}}
@keyframes legs{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes note{0%{opacity:0;translate:0 0}20%{opacity:1}100%{opacity:0;translate:10px -60px}}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(14px,3vw,32px) 14px 28px;gap:clamp(10px,2vw,18px)}
h1{margin:0;font-weight:900;font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:.04em;color:#fff8ee;text-shadow:0 3px 0 #8a5633,0 6px 16px rgba(80,40,10,.35);text-align:center}
[hidden]{display:none!important}

/* タイトル画面 */
.menu{width:100%;max-width:620px;background:rgba(255,248,236,.97);border-radius:28px;padding:clamp(18px,3vw,30px);box-shadow:0 14px 34px rgba(90,50,20,.25);display:grid;gap:18px}
.menu h2{margin:0 0 8px;font-size:17px;font-weight:900}
.note{margin:6px 0 0;font-size:14px;color:#7a5a40}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{min-height:48px;border-radius:16px;border:3px solid #ecd3b3;background:#fffaf2;font:700 16px "Zen Maru Gothic",sans-serif;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px}
.opt img{width:58px;height:58px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.opt[aria-pressed=true]{border-color:var(--accent);background:#fff0df;box-shadow:0 0 0 3px rgba(224,120,47,.2)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lv .opt{flex-direction:column;gap:0;line-height:1.2}
.lv .opt span{font-size:12px;font-weight:500;color:#8a6a50}
.lv .opt.oni[aria-pressed=true]{border-color:#b2322a;background:#fde6e1}
.foe{display:flex;align-items:center;gap:14px;background:#fffaf2;border-radius:18px;padding:12px 14px;border:2px dashed #e5c7a2}
.foe img{width:64px;height:64px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.foe b{display:block;font-size:19px;line-height:1.2}
.foe small{font-size:14px;color:#7a5a40}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
select{min-height:44px;font:500 16px "Zen Maru Gothic",sans-serif;color:var(--ink);background:#fffaf2;border:2px solid #ecd3b3;border-radius:12px;padding:0 10px;flex:1 1 220px}
.go{font-size:20px!important;min-height:56px!important;width:100%}

/* 対局画面 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(12px,2.5vw,28px);width:100%;max-width:1120px}
.side{display:flex;justify-content:flex-end}.side.r{justify-content:flex-start}
.score{background:var(--card);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(90,50,20,.18);border:3px solid transparent;transition:border-color .25s,transform .25s;width:210px}
.score.on{border-color:var(--accent);transform:translateY(-3px)}
.score img{width:54px;height:54px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.score b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.score small{display:block;font-size:13px;font-weight:700;line-height:1.3}
.score em{display:block;font-style:normal;font-size:12px;color:#8a6a50;line-height:1.3}
.frame{position:relative;padding:clamp(10px,2.2vw,18px);background:linear-gradient(145deg,#7d4f2e,#5a361e);border-radius:18px;box-shadow:0 18px 34px rgba(60,30,10,.4),inset 0 2px 0 rgba(255,220,180,.35),inset 0 -3px 0 rgba(0,0,0,.25)}
.board{--sz:min(88vw,62vh,540px);width:var(--sz);height:var(--sz);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px;background:var(--line);border:2px solid var(--line);border-radius:4px}
.cell{position:relative;background:var(--board);display:grid;place-items:center;padding:0;border:0;font:inherit;cursor:default}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.cell.can{cursor:pointer}
.cell.can::after{content:"";width:22%;height:22%;border-radius:50%;background:rgba(224,120,47,.45);box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.cell.can:hover::after{background:rgba(224,120,47,.8)}
.cell.last{box-shadow:inset 0 0 0 3px rgba(224,120,47,.75)}
.piece{position:absolute;inset:3%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,1.6,.5,1)}
.piece.p2{transform:rotateY(180deg)}
.piece.pop{animation:pop .3s ease-out}
.piece img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;filter:drop-shadow(0 2px 2px rgba(60,30,10,.35));user-select:none;-webkit-user-drag:none}
.piece img.b{transform:rotateY(180deg)}
@keyframes pop{0%{scale:.3}70%{scale:1.12}100%{scale:1}}
.msg{min-height:1.6em;text-align:center;font-weight:700;font-size:17px;background:var(--card);padding:6px 18px;border-radius:999px;box-shadow:0 4px 12px rgba(90,50,20,.15)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button.btn{min-height:44px;padding:0 18px;border-radius:999px;border:0;font:700 16px "Zen Maru Gothic",sans-serif;color:var(--ink);background:#fff8ee;box-shadow:0 4px 0 #b8875c;cursor:pointer}
button.btn:active{translate:0 3px;box-shadow:0 1px 0 #b8875c}
button.btn.main{background:var(--accent);color:#fff;box-shadow:0 4px 0 #a4521b}
button.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.btn[aria-pressed=true]{background:#7a4a2a;color:#fff8ee;box-shadow:0 4px 0 #4a2a14}
.over{position:absolute;inset:0;display:none;place-items:center;background:rgba(70,40,20,.45);border-radius:18px}
.over.show{display:grid}
.over>div{background:#fff8ee;border-radius:22px;padding:22px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);margin:12px}
.over h2{margin:0 0 6px;font-size:30px;line-height:1.15}
.over img{width:90px;height:90px;animation:pop .5s}
.over p{margin:0 0 14px;font-weight:700}
.over .ctrl{gap:8px}
.bub{position:absolute;z-index:5;transform:translate(-50%,-100%);transform-origin:50% 100%;background:#fff;border:2.5px solid #4a2f1d;border-radius:14px;padding:2px 10px;font:900 15px "Zen Maru Gothic",sans-serif;color:#4a2f1d;white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(74,47,29,.25);animation:bub 1.9s ease both}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;background:#fff;border:solid #4a2f1d;border-width:0 2.5px 2.5px 0;transform:translateX(-50%) rotate(45deg)}
@keyframes bub{0%{opacity:0;scale:.3}12%{opacity:1;scale:1.12}20%{scale:1}78%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -10px}}
.score{position:relative}
.bub.nag{left:50px;top:-6px;animation:nagIn .35s ease both;font-size:14px;z-index:6}
.bub.nag::after{left:22px}
@keyframes nagIn{0%{opacity:0;scale:.3}70%{opacity:1;scale:1.1}100%{opacity:1;scale:1}}
.dice{display:flex;justify-content:center;gap:clamp(10px,3vw,22px)}
.die{width:clamp(72px,20vw,96px);aspect-ratio:1;border-radius:18px;background:#fff;box-shadow:0 5px 0 #d8b994,0 8px 18px rgba(90,50,20,.2);display:grid;place-items:center;transition:box-shadow .2s}
.die img{width:80%;height:80%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.die.rolling{animation:tumble .3s linear infinite}
.die.win{box-shadow:0 5px 0 #a4521b,0 0 0 4px var(--accent),0 8px 18px rgba(90,50,20,.2)}
@keyframes tumble{0%{rotate:0deg;translate:0 0}25%{rotate:12deg;translate:0 -8px}50%{rotate:0deg;translate:0 0}75%{rotate:-12deg;translate:0 -8px}100%{rotate:0deg}}
.jk{text-align:center}
#lose{position:fixed;inset:0;z-index:60;background:rgba(18,12,28,.7);display:grid;place-items:center;padding:16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#lose[hidden]{display:none!important}
.lbox{display:grid;justify-items:center;gap:10px;text-align:center}
.lbox h2{margin:0;font:900 clamp(44px,9vw,80px)/1.05 "Zen Maru Gothic",sans-serif;color:#fff;letter-spacing:.06em;text-shadow:0 4px 0 #3a2a4a,0 8px 24px rgba(0,0,0,.5);animation:sink 1.2s ease-out both}
.lfig{position:relative;margin-top:28px}
.lfig img{display:block;width:auto;height:auto;max-height:clamp(170px,40vh,340px);max-width:min(86vw,560px);filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.lfig .bub{position:absolute;left:auto;right:-14px;top:-30px;transform:none;font-size:clamp(16px,3vw,22px);padding:4px 14px;animation:nagIn .4s .6s ease both}
.lfig .bub::after{left:28%}
#loseSub{margin:0;color:#f3e6ff;font-weight:700;font-size:16px}
@keyframes sink{0%{opacity:0;translate:0 -30px}100%{opacity:1;translate:0 0}}
.jk h2{font-size:22px;margin:0}
.jkvs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.jkside{display:grid;justify-items:center;gap:4px}
.jkside img{width:84px;height:84px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.jkside b{font-size:15px;line-height:1.3}
.hand{width:86px;height:86px;border-radius:50%;background:#fff0df;display:grid;place-items:center;font:900 34px "Zen Maru Gothic",sans-serif;color:#c9a27c}
.hand svg{width:70%;height:70%}
.hand.shake{animation:shake .5s ease-in-out infinite}
.hand.show svg{animation:pop .35s}
@keyframes shake{0%,100%{translate:0 0}50%{translate:0 -10px}}
.vs{font:900 26px "Zen Maru Gothic",sans-serif;color:var(--accent)}
.jkmsg{margin:0;font-weight:900;font-size:19px;min-height:1.6em}
.hands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hands .opt{flex-direction:column;gap:2px;min-height:110px;line-height:1.2}
.hands .opt svg{width:56px;height:56px}
.hands .opt span{font-size:12px;font-weight:500;color:#8a6a50}
@media(max-width:760px){.stage{grid-template-columns:1fr 1fr}.frame{grid-column:1/-1;grid-row:1;justify-self:center}.side,.side.r{justify-content:center}.score{width:100%;max-width:240px;padding:10px 12px;gap:8px}.score img{width:42px;height:42px}.score b{font-size:24px}}
@media(max-width:520px){#wdance{height:150px}.over>div{padding:12px 16px}.over h2{font-size:24px}.over p{margin-bottom:10px}.lv{grid-template-columns:repeat(2,minmax(0,1fr))}.opt img{width:46px;height:46px}}
@media(prefers-reduced-motion:reduce){#dancer *,#wdance *{animation:none!important}.piece{transition:none}.piece.pop,.over img{animation:none}}
</style>
</head>
<body>
<svg id="room" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e4c8"/><stop offset="1" stop-color="#ebcfa6"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset=".65" style="stop-color:var(--sky2)"/><stop offset="1" style="stop-color:var(--sky3)"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c08a58"/><stop offset="1" stop-color="#a06e41"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--beam)" stop-opacity=".6"/><stop offset="1" style="stop-color:var(--beam)" stop-opacity="0"/></linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4875a"/><stop offset="1" stop-color="#b8673d"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c4" stop-opacity=".85"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ffd39a"/><stop offset="1" stop-color="#c76b3c"/></radialGradient>
    <radialGradient id="earth" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#2e6bb8"/></radialGradient>
    <clipPath id="glass"><rect x="1010" y="150" width="400" height="400"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <g opacity=".22" stroke="#d9b98c" stroke-width="3"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600"/></g>
  <!-- 窓 -->
  <rect x="990" y="130" width="440" height="440" rx="10" fill="#fffaf0"/>
  <g clip-path="url(#glass)">
    <rect x="1010" y="150" width="400" height="400" fill="url(#sky)"/>
    <g class="sc-morning"><circle cx="1110" cy="470" r="90" fill="url(#sunglow)"/><circle cx="1110" cy="470" r="34" fill="#ffb36b"/>
      <g fill="#fff" opacity=".8"><ellipse cx="1300" cy="250" rx="54" ry="14"/><ellipse cx="1330" cy="242" rx="30" ry="14"/></g></g>
    <g class="sc-noon"><circle cx="1340" cy="215" r="80" fill="url(#sunglow)"/><circle cx="1340" cy="215" r="30" fill="#fff1a0"/>
      <g fill="#fff" opacity=".95"><ellipse cx="1110" cy="230" rx="50" ry="18"/><ellipse cx="1150" cy="220" rx="36" ry="20"/><ellipse cx="1250" cy="320" rx="44" ry="14"/></g></g>
    <g class="sc-night"><circle cx="1320" cy="235" r="34" fill="#fff6cf"/><circle cx="1336" cy="224" r="30" fill="#25306a"/>
      <g fill="#fff"><circle cx="1060" cy="190" r="2.5"/><circle cx="1130" cy="260" r="2"/><circle cx="1200" cy="200" r="3"/><circle cx="1250" cy="300" r="2"/><circle cx="1090" cy="340" r="2.5"/><circle cx="1380" cy="330" r="2"/><circle cx="1170" cy="380" r="1.8"/><circle cx="1290" cy="170" r="2"/></g></g>
    <g class="sc-space">
      <g fill="#fff"><circle cx="1040" cy="180" r="2"/><circle cx="1080" cy="260" r="1.5"/><circle cx="1150" cy="170" r="2.5"/><circle cx="1230" cy="230" r="1.5"/><circle cx="1290" cy="180" r="2"/><circle cx="1380" cy="200" r="2.5"/><circle cx="1050" cy="420" r="2"/><circle cx="1190" cy="470" r="1.5"/><circle cx="1260" cy="420" r="2.5"/><circle cx="1390" cy="380" r="1.5"/><circle cx="1110" cy="520" r="2"/><circle cx="1350" cy="520" r="2"/><circle cx="1030" cy="320" r="1.5"/><circle cx="1240" cy="330" r="1.5"/></g>
      <ellipse cx="1120" cy="300" rx="92" ry="20" fill="none" stroke="#f7d9a8" stroke-width="8" transform="rotate(-18 1120 300)"/>
      <circle cx="1120" cy="300" r="52" fill="url(#planet)"/>
      <path d="M1028 300A92 20 0 0 0 1212 300" fill="none" stroke="#f7d9a8" stroke-width="8" transform="rotate(-18 1120 300)"/>
      <circle cx="1340" cy="450" r="46" fill="url(#earth)"/>
      <path d="M1312 432q14-12 24 0t20 10q-10 18-26 10zM1350 470q12-6 20 4-8 12-20 6z" fill="#7cc46a"/>
      <path d="M1250 170l-70 40" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    </g>
    <g class="sc-hills"><path d="M1010 470q70-40 140-10t130-20 130 10v100H1010z" style="fill:var(--hill1)"/>
      <path d="M1010 500q90-30 190 0t210-10v60H1010z" style="fill:var(--hill2)"/></g>
  </g>
  <path d="M1210 150V550M1010 350H1410" stroke="#fffaf0" stroke-width="14"/>
  <rect x="975" y="565" width="470" height="22" rx="6" fill="#fff4e2"/>
  <path d="M950 110q20 240 0 500h70q-30-260 10-500z" fill="#e99b62"/>
  <path d="M1470 110q-20 240 0 500h-70q30-260-10-500z" fill="#e99b62"/>
  <rect x="930" y="100" width="560" height="16" rx="8" fill="#7a4a2a"/>
  <polygon points="1010,550 1410,550 1540,1000 760,1000" fill="url(#sun)"/>
  <!-- 額縁 -->
  <rect x="300" y="190" width="200" height="150" rx="6" fill="#8a5633"/>

<main>
  <h1>シバリバーシバ</h1>

  <section class="menu" id="menu" aria-label="タイトル画面">
    <div>
      <h2>あそびかた</h2>
      <div class="pick" id="modePick">
        <button class="opt" data-mode="cpu" aria-pressed="true">コンピューターと対戦</button>
        <button class="opt" data-mode="pvp" aria-pressed="false">ふたりで対戦</button>
      </div>
    </div>
    <div id="sideBox">
      <h2 id="sideTitle">自分のコマ</h2>
      <div class="pick" id="sidePick">
        <button class="opt" data-side="1" aria-pressed="true"><img class="pimg1" alt="">赤柴</button>
        <button class="opt" data-side="2" aria-pressed="false"><img class="pimg2" alt="">黒柴</button>
      </div>
      <p class="note" id="sideNote"></p>
    </div>
    <div id="lvBox">
      <h2>むずかしさ</h2>
      <div class="lv" id="lvPick"></div>
    </div>
    <div id="foeBox">
      <h2>対戦あいて</h2>
      <div class="foe"><img id="foeImg" alt=""><div><b id="foeName"></b><small id="foeDesc"></small></div></div>
      <div class="row">
        <select id="foeSel" aria-label="対戦あいてをえらぶ"></select>
        <button class="btn" id="shuffle">ほかの子にする</button>
      </div>
    </div>
    <button class="btn main go" id="startBtn">はじめる</button>
  </section>

  <section class="menu jk" id="janken" hidden aria-label="柴犬じゃんけん">
    <h2>柴犬じゃんけんで先攻を決めよう！</h2>
    <div class="jkvs">
      <div class="jkside"><img id="jkImgA" alt=""><b id="jkNameA"></b><div class="hand" id="jkHandA">？</div></div>
      <span class="vs">VS</span>
      <div class="jkside"><img id="jkImgB" alt=""><b id="jkNameB"></b><div class="hand" id="jkHandB">？</div></div>
    </div>
    <p class="jkmsg" id="jkMsg" aria-live="polite"></p>
    <div class="hands" id="jkHands"></div>
    <button class="btn main go" id="jkGo" hidden>対局スタート</button>
    <button class="btn" id="jkBack">タイトルへ</button>
  </section>

  <section class="menu jk" id="dice" hidden aria-label="サイコロで先攻決め">
    <h2>サイコロで先攻を決めよう！</h2>
    <p class="note">赤柴と黒柴の顔がかいてあるサイコロを3つふって、多く出た顔の柴が先攻です。</p>
    <div class="jkvs">
      <div class="jkside"><img id="dcImgA" alt=""><b id="dcNameA"></b></div>
      <span class="vs">VS</span>
      <div class="jkside"><img id="dcImgB" alt=""><b id="dcNameB"></b></div>
    </div>
    <div class="dice"><div class="die"><img alt=""></div><div class="die"><img alt=""></div><div class="die"><img alt=""></div></div>
    <p class="jkmsg" id="dcMsg" aria-live="polite"></p>
    <button class="btn main go" id="dcRoll">サイコロをふる</button>
    <button class="btn main go" id="dcGo" hidden>対局スタート</button>
    <button class="btn" id="dcBack">タイトルへ</button>
  </section>

  <section id="game" hidden style="display:contents">
    <div class="stage">
      <div class="side"><div class="score" id="s1"><img id="a1" alt=""><div><small id="n1"></small><em id="e1"></em><b id="c1">2</b></div></div></div>
      <div class="frame">
        <div class="board" id="board" role="grid" aria-label="リバーシ盤"></div>
        <div class="over" id="over"><div><img id="wimg" alt=""><div id="wdance" hidden role="img" aria-label="しっぽを振る柴">
<img class="body" id="wdBody" alt="">
<img class="tail" id="wdTail" alt="">
<span class="note" style="left:0;top:4%">♪</span><span class="note" style="right:2%;top:2%;animation-delay:.8s">♫</span>
</div><h2 id="wtxt"></h2><p id="wsub"></p>
          <div class="ctrl"><button class="btn main" id="again">もういちど</button><button class="btn" id="toTitle2">タイトルへ</button></div></div></div>
      </div>
      <div class="side r"><div class="score" id="s2"><img id="a2" alt=""><div><small id="n2"></small><em id="e2"></em><b id="c2">2</b></div></div></div>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="ctrl">
      <button class="btn main" id="reset">はじめから</button>
      <button class="btn" id="undo">ひとつ戻す</button>
      <button class="btn" id="hint" aria-pressed="true">置ける場所：表示</button>
      <button class="btn" id="toTitle">タイトルへ</button>
    </div>
  </section>
</main>

const WALL=3,DIRS=[-11,-10,-9,-1,1,9,10,11];
const SQ=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)SQ.push((r+1)*10+c+1);
const CORNERS=[11,18,81,88];
const newBoard=()=>{const b=new Int8Array(100).fill(WALL);for(const s of SQ)b[s]=0;b[44]=b[55]=2;b[45]=b[54]=1;return b};
function canPlace(b,s,p){
  if(b[s])return false;const o=3-p;
  for(const d of DIRS){let t=s+d;if(b[t]!==o)continue;t+=d;while(b[t]===o)t+=d;if(b[t]===p)return true}
  return false;
}
function genMoves(b,p){const m=[];for(const s of SQ)if(canPlace(b,s,p))m.push(s);return m}
function doMove(b,s,p){
  const o=3-p,f=[];
  for(const d of DIRS){let t=s+d,n=0;while(b[t]===o){t+=d;n++}if(n&&b[t]===p){t-=d;while(t!==s){b[t]=p;f.push(t);t-=d}}}
  b[s]=p;return f;
}
function undoMove(b,s,f,p){b[s]=0;const o=3-p;for(const t of f)b[t]=o}
const count=(b,p)=>{let n=0;for(const s of SQ)if(b[s]===p)n++;return n};

const LEVELS=[
 {n:'初心者',sub:'はじめて',pre:'こいぬの',depth:1,noise:45,blunder:.3,k:0,solve:0,ms:300},
 {n:'普通',sub:'ちょっと強い',pre:'わんぱく',depth:2,noise:14,blunder:.07,k:.3,solve:6,ms:600},
 {n:'上級',sub:'かなり強い',pre:'かしこい',depth:4,noise:3,blunder:.01,k:.6,solve:10,ms:1200},
 {n:'鬼',sub:'本気の本気',pre:'鬼の',depth:7,noise:0,blunder:0,k:.85,solve:14,ms:2000}
];
const STRONG={t:'std',pos:1,mob:8,front:4,disc:0,corner:30,parity:2,late:0,near:0};
const KEYS=['pos','mob','front','disc','corner','parity','late','near'];
const foeName=(L,i)=>LEVELS[L].pre+NAMES[(i+L*7)%20];
function buildAI(L,i){
  const lv=LEVELS[L],st=STYLES[i],k=lv.k,w={};
  for(const key of KEYS)w[key]=(st[key]||0)*(1-k)+STRONG[key]*k;
  const a=toPad(TAB[st.t]),s=toPad(TAB.std),T=new Float32Array(100);
  for(const q of SQ)T[q]=a[q]*(1-k)+s[q]*k;
  w.T=T;
  w.depth=Math.max(1,lv.depth+(st.depth||0));
  w.noise=lv.noise*(st.noise||1);
  w.blunder=Math.min(.6,lv.blunder*(st.blunder||1));
  w.solve=lv.solve;w.ms=lv.ms;
  return w;
}

/* ===== 探索 ===== */
function frontier(b,s){for(const d of DIRS)if(b[s+d]===0)return true;return false}
function evaluate(b,p,w){
  const o=3-p;let pos=0,disc=0,front=0,empty=0;
  for(const s of SQ){const v=b[s];if(!v){empty++;continue}const g=v===p?1:-1;pos+=w.T[s]*g;disc+=g;if(frontier(b,s))front+=g}
  let corner=0;for(const c of CORNERS)if(b[c])corner+=b[c]===p?1:-1;
  let mob=0;if(w.mob)mob=genMoves(b,p).length-genMoves(b,o).length;
  let v=w.pos*pos+w.mob*mob-w.front*front+w.disc*disc+w.corner*corner+w.parity*(empty%2?1:-1);
  if(w.late&&empty<18)v+=w.late*disc;
  return v;
}
const ABORT={};let deadline=0,nodes=0;
function finalScore(b,p){const d=count(b,p)-count(b,3-p);return d>0?100000+d:d<0?-100000+d:0}
function negamax(b,p,depth,alpha,beta,passed,w){
  if((++nodes&1023)===0&&performance.now()>deadline)throw ABORT;
  if(depth<=0)return evaluate(b,p,w);
  const ms=genMoves(b,p);
  if(!ms.length){
    if(passed)return finalScore(b,p);
    return -negamax(b,3-p,depth,-beta,-alpha,true,w);
  }
  ms.sort((x,y)=>ORDER[y]-ORDER[x]);
  let best=-Infinity;
  for(const s of ms){
    const f=doMove(b,s,p);
    let v;try{v=-negamax(b,3-p,depth-1,-beta,-alpha,false,w)}finally{undoMove(b,s,f,p)}
    if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break;
  }
  return best;
}
function chooseMove(board,p,w,lastOpp){
  const b=Int8Array.from(board);
  let ms=genMoves(b,p);if(!ms.length)return null;
  if(ms.length===1)return ms[0];
  if(Math.random()<w.blunder)return ms[Math.floor(Math.random()*ms.length)];
  let empty=0;for(const s of SQ)if(!b[s])empty++;
  const target=empty<=w.solve?empty:w.depth;
  deadline=performance.now()+w.ms;nodes=0;
  const noise=new Map(ms.map(s=>[s,(Math.random()*2-1)*w.noise]));
  const bonus=s=>w.near&&lastOpp&&DIRS.some(d=>s+d===lastOpp)?w.near:0;
  ms.sort((x,y)=>ORDER[y]-ORDER[x]);
  let result=null;
  for(let d=1;d<=target;d++){
    const sc=new Map();let alpha=-Infinity;
    try{
      for(const s of ms){
        const f=doMove(b,s,p);let v;
        try{
          v=w.noise?-negamax(b,3-p,d-1,-Infinity,Infinity,false,w):-negamax(b,3-p,d-1,-Infinity,-alpha+1e-6,false,w);
        }finally{undoMove(b,s,f,p)}
        sc.set(s,v);if(v>alpha)alpha=v;
      }
    }catch(e){if(e!==ABORT)throw e;break}
    result=sc;ms.sort((x,y)=>sc.get(y)-sc.get(x));
  }
  if(!result){result=new Map(ms.map(s=>[s,0]))}
  let best=null,bs=-Infinity;
  for(const s of ms){const v=result.get(s)+noise.get(s)+bonus(s);if(v>bs){bs=v;best=s}}
  return best;
}

  el.hidden=false;
  const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let x=Math.random()*(innerWidth-150),y=innerHeight*.35,vx=(Math.random()<.5?-1:1)*2.6,vy=-1.8;
  const step=()=>{
    const W=innerWidth-150,H=innerHeight-190;
    if(red){x=W/2;y=H*.8}
    else{x+=vx;y+=vy;if(x<0||x>W){vx=-vx;x=Math.max(0,Math.min(W,x))}if(y<0||y>H){vy=-vy;y=Math.max(0,Math.min(H,y))}}
    el.style.transform=`translate(${x}px,${y}px) scaleX(${vx<0?-1:1})`;
    danceRAF=requestAnimationFrame(step);
  };
  danceRAF=requestAnimationFrame(step);
}
function stopDance(){cancelAnimationFrame(danceRAF);$('dancer').hidden=true}
function pickFoe(){foeIdx=set.foe>=0?set.foe:Math.floor(Math.random()*20)}
function drawMenu(){
  document.querySelectorAll('#modePick .opt').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===set.mode)));
  document.querySelectorAll('#sidePick .opt').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.side===set.side)));
  document.querySelectorAll('#lvPick .opt').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.lv===set.lv)));
  const cpu=set.mode==='cpu';
  $('lvBox').hidden=$('foeBox').hidden=!cpu;
  $('sideTitle').textContent=cpu?'自分のコマ':'1Pのコマ';
  $('sideNote').textContent=cpu?'選ばなかったほうの柴がコンピューターになります。先攻・後攻は柴犬じゃんけんで決めます。':'2Pはもう一方の柴になります。先攻・後攻はサイコロで決めます。';
  setScene();
  $('foeSel').innerHTML='<option value="-1">おまかせ（毎回ちがう子）</option>'+STYLES.map((s,i)=>`<option value="${i}">${foeName(set.lv,i)}：${s.d}</option>`).join('');
  $('foeSel').value=String(set.foe);
  $('foeImg').src=avatar(set.lv,foeIdx,3-set.side);
  $('foeName').textContent=`${foeName(set.lv,foeIdx)}（${LEVELS[set.lv].n}）`;
  $('foeDesc').textContent=STYLES[foeIdx].d;
}
function save(){try{localStorage.setItem('shibareversiba',JSON.stringify(set))}catch(e){}}
$('modePick').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;set.mode=b.dataset.mode;save();drawMenu()});
$('sidePick').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;set.side=+b.dataset.side;save();drawMenu()});
$('lvPick').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;set.lv=+b.dataset.lv;save();drawMenu()});
$('foeSel').addEventListener('change',e=>{set.foe=+e.target.value;save();pickFoe();drawMenu()});
$('shuffle').addEventListener('click',()=>{let n;do{n=Math.floor(Math.random()*20)}while(n===foeIdx);foeIdx=n;set.foe=-1;save();drawMenu()});
const startOrder=()=>($('lose').hidden=true,0)||set.mode==='cpu'?startJanken():startDice();
$('startBtn').addEventListener('click',startOrder);
function toTitle(){$('lose').hidden=true;stopDance();clearTimeout(cpuTimer);clearTimeout(jkTimer);clearInterval(dcTimer);stopNag();busy=false;$('game').hidden=true;$('janken').hidden=true;$('dice').hidden=true;$('menu').hidden=false;if(set.foe<0)pickFoe();drawMenu()}
$('toTitle').addEventListener('click',toTitle);$('toTitle2').addEventListener('click',toTitle);$('jkBack').addEventListener('click',toTitle);$('dcBack').addEventListener('click',toTitle);

/* ===== 柴犬じゃんけん ===== */
let jk={a:null,step:0,first:1},jkTimer=0;
$('jkHands').innerHTML=HANDS.map((h,i)=>`<button class="opt" data-h="${i}">${h.svg}${h.n}<span>${h.d}</span></button>`).join('');
function sideA(){return set.mode==='cpu'?set.side:1}
function startJanken(){
  stopDance();clearTimeout(cpuTimer);stopNag();busy=false;HUMAN=set.side;
  $('menu').hidden=true;$('game').hidden=true;$('janken').hidden=false;
  const A=sideA(),Bs=3-A,cpu=set.mode==='cpu';
  $('jkImgA').src=IMG[A];$('jkImgB').src=cpu?avatar(set.lv,foeIdx,Bs):IMG[Bs];
  $('jkNameA').textContent=cpu?`あなた（${PNAME[A]}）`:PNAME[A];
  $('jkNameB').textContent=cpu?foeName(set.lv,foeIdx):PNAME[Bs];
  jk={a:null,step:0,first:1};
  resetHands();
  $('jkMsg').textContent=cpu?'じゃん けん…　手をえらんでね':`${PNAME[A]}の人から手をえらんでね`;
}
function resetHands(){
  for(const id of ['jkHandA','jkHandB']){$(id).innerHTML='？';$(id).className='hand'}
  $('jkHands').hidden=false;$('jkGo').hidden=true;
}
$('jkHands').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const h=+b.dataset.h,cpu=set.mode==='cpu';
  if(!cpu&&jk.step===0){
    jk.a=h;jk.step=1;$('jkHandA').innerHTML='OK';
    $('jkMsg').textContent=`つぎは${PNAME[3-sideA()]}の人（${PNAME[sideA()]}の人は見ないでね）`;return;
  }
  const a=cpu?h:jk.a,bb=cpu?Math.floor(Math.random()*3):h;
  $('jkHands').hidden=true;
  for(const id of ['jkHandA','jkHandB']){$(id).innerHTML='？';$(id).className='hand shake'}
  $('jkMsg').textContent='ぽん！';
  jkTimer=setTimeout(()=>{
    $('jkHandA').className=$('jkHandB').className='hand show';
    $('jkHandA').innerHTML=HANDS[a].svg;$('jkHandB').innerHTML=HANDS[bb].svg;
    const A=sideA();
    if(a===bb){
      $('jkMsg').textContent='あいこ！ もういっかい';
      jk.step=0;
      jkTimer=setTimeout(()=>{resetHands();$('jkMsg').textContent=cpu?'あいこで…　手をえらんでね':`${PNAME[A]}の人から手をえらんでね`},1100);
      return;
    }
    jk.first=beats(a,bb)?A:3-A;
    const nm=cpu?(jk.first===HUMAN?'あなた':foeName(set.lv,foeIdx)):PNAME[jk.first];
    $('jkMsg').textContent=`${nm}の先攻！`;
    $('jkGo').hidden=false;$('jkGo').focus();
  },700);
});
$('jkGo').addEventListener('click',()=>{$('janken').hidden=true;$('game').hidden=false;newGame(jk.first)});

/* ===== サイコロ（2人対戦の先攻決め） ===== */
let dcTimer=0;
const dice=[...document.querySelectorAll('.die')];
function startDice(){
  stopDance();clearTimeout(cpuTimer);stopNag();busy=false;HUMAN=set.side;
  $('menu').hidden=true;$('game').hidden=true;$('janken').hidden=true;$('dice').hidden=false;
  const A=set.side;
  $('dcImgA').src=IMG[A];$('dcImgB').src=IMG[3-A];
  $('dcNameA').textContent=`1P（${PNAME[A]}）`;$('dcNameB').textContent=`2P（${PNAME[3-A]}）`;
  dice.forEach((d,i)=>{d.className='die';d.firstChild.src=IMG[i%2+1]});
  $('dcMsg').textContent='どっちの顔が多く出るかな？';
  $('dcRoll').hidden=false;$('dcGo').hidden=true;
}
$('dcRoll').addEventListener('click',()=>{
  $('dcRoll').hidden=true;$('dcMsg').textContent='ころころ…';
  const res=dice.map(()=>Math.random()<.5?1:2);
  dice.forEach(d=>d.className='die rolling');
  let n=0;
  dcTimer=setInterval(()=>{
    dice.forEach(d=>d.firstChild.src=IMG[Math.random()<.5?1:2]);
    if(++n<12)return;
    clearInterval(dcTimer);
    const c1=res.filter(v=>v===1).length,first=c1>=2?1:2;
    dice.forEach((d,i)=>{d.firstChild.src=IMG[res[i]];d.className='die'+(res[i]===first?' win':'')});
    jk.first=first;
    $('dcMsg').textContent=`${PNAME[first]}が${first===1?c1:3-c1}つ！ ${who(first)}の先攻！`;
    $('dcGo').hidden=false;$('dcGo').focus();
  },100);
});
$('dcGo').addEventListener('click',()=>{$('dice').hidden=true;$('game').hidden=false;newGame(jk.first)});

/* ===== なかなか置かないときのひとこと ===== */
const NAG={1:['まだかー','聞いてるかー','はよー','はぁ。。。'],2:['大丈夫ですか？','大丈夫かな。。。','心配なってきた。。。','頑張ってくださいーー']};
let nagT=[],nagI=0;
function stopNag(){nagT.forEach(clearTimeout);nagT=[];clearInterval(nagI);document.querySelectorAll('.nag').forEach(x=>x.remove())}
function nag(t){
  document.querySelectorAll('.nag').forEach(x=>x.remove());
  const d=document.createElement('div');d.className='bub nag';d.textContent=t;
  $('s'+HUMAN).appendChild(d);
}
function startNag(){
  stopNag();
  if(set.mode!=='cpu'||turn!==HUMAN||busy)return;
  const L=NAG[HUMAN];
  [3000,5000,10000,15000].forEach((t,i)=>nagT.push(setTimeout(()=>nag(L[i]),t)));
  nagT.push(setTimeout(()=>{nagI=setInterval(()=>nag(L[Math.floor(Math.random()*4)]),5000)},15000));
}

/* ===== 対局 ===== */
const boardEl=$('board'),cells=[],pieces={};
let B,turn,hist,last,busy=false,showHint=true,AI=null,HUMAN=1,cpuTimer=0,PIMG={1:IMG[1],2:IMG[2]};
const isCpu=p=>set.mode==='cpu'&&p!==HUMAN;
for(const s of SQ){
  const r=Math.floor(s/10),c=s%10;
  const el=document.createElement('button');
  el.className='cell';el.type='button';el.setAttribute('role','gridcell');
  el.addEventListener('click',()=>onCell(s));
  boardEl.appendChild(el);cells[s]=el;
}
const who=p=>set.mode==='cpu'?(p===HUMAN?'あなた':foeName(set.lv,foeIdx)):`${p===set.side?'1P':'2P'}（${PNAME[p]}）`;

let gFirst=1;
function newGame(first){
  clearTimeout(cpuTimer);stopDance();setScene();
  if(first)gFirst=first;
  HUMAN=set.side;
  AI=set.mode==='cpu'?buildAI(set.lv,foeIdx):null;
  B=newBoard();turn=gFirst;hist=[];last=null;busy=false;
  stopNag();
  PIMG={1:IMG[1],2:IMG[2]};
  if(AI)PIMG[3-HUMAN]=avatar(set.lv,foeIdx,3-HUMAN);
  for(const s in pieces){pieces[s].remove();delete pieces[s]}
  $('over').classList.remove('show');
  for(const p of [1,2]){
    $('a'+p).src=PIMG[p];
    $('n'+p).textContent=set.mode==='cpu'?(p===HUMAN?`あなた（${PNAME[p]}）`:foeName(set.lv,foeIdx)):who(p);
    $('e'+p).textContent=set.mode==='cpu'&&p!==HUMAN?`${LEVELS[set.lv].n}・${STYLES[foeIdx].d}`:'';
  }
  render();
  say(`${who(turn)}の先攻です`);
  if(isCpu(turn))cpuTurn();else startNag();
}
function render(){
  const can=busy||isCpu(turn)?[]:genMoves(B,turn);
  for(const s of SQ){
    const v=B[s],cell=cells[s];
    if(v&&!pieces[s]){
      const d=document.createElement('div');
      d.className='piece pop'+(v===2?' p2':'');
      d.innerHTML=`<img class="f" src="${PIMG[1]}" alt=""><img class="b" src="${PIMG[2]}" alt="">`;
      cell.appendChild(d);pieces[s]=d;
    }else if(!v&&pieces[s]){pieces[s].remove();delete pieces[s]}
    if(pieces[s])pieces[s].classList.toggle('p2',v===2);
    const ok=can.includes(s);
    cell.classList.toggle('can',ok&&showHint);
    cell.dataset.ok=ok?'1':'';
    cell.classList.toggle('last',last===s);
    cell.setAttribute('aria-label',`${Math.floor(s/10)}行${s%10}列 ${v?PNAME[v]:(ok?'置ける':'空き')}`);
  }
  $('c1').textContent=count(B,1);$('c2').textContent=count(B,2);
  $('s1').classList.toggle('on',turn===1);$('s2').classList.toggle('on',turn===2);
}
const say=t=>$('msg').textContent=t;
function onCell(s){if(busy||isCpu(turn)||!cells[s].dataset.ok)return;play(s)}
function play(s){
  if(!canPlace(B,s,turn))return;
  hist.push({B:Int8Array.from(B),turn,last});
  stopNag();doMove(B,s,turn);last=s;next();
}
function next(){
  const o=3-turn;
  if(genMoves(B,o).length){turn=o;say(`${who(turn)}の番です`)}
  else if(genMoves(B,turn).length){say(`${who(o)}は置ける場所がないのでパス！もう一度${who(turn)}の番`)}
  else{render();return finish()}
  render();
  if(isCpu(turn))cpuTurn();else startNag();
}
function cpuTurn(){
  busy=true;render();
  const me=turn,lastOpp=last;
  cpuTimer=setTimeout(()=>{
    say(`${who(me)}が考えています…`);
    cpuTimer=setTimeout(()=>{
      const s=chooseMove(B,me,AI,lastOpp);
      busy=false;
      if(s!=null)play(s);
    },30);
  },450);
}
function finish(){
  stopNag();
  const a=count(B,1),b=count(B,2),w=a===b?0:(a>b?1:2);
  const humanWin=w&&(set.mode==='pvp'||w===HUMAN),maracas=!!humanWin;
  $('wimg').src=PIMG[w||1];$('wimg').style.display=w&&!maracas?'':'none';
  $('wdance').hidden=!maracas;
  if(maracas){const g=WAG[w];$('wdBody').src=g.body;$('wdTail').src=g.tail;$('wdance').style.aspectRatio=g.w+'/'+g.h;$('wdTail').style.transformOrigin=g.piv[0]+'% '+g.piv[1]+'%'}
  let t;
  if(!w)t='ひきわけ！';
  else if(set.mode==='cpu')t=w===HUMAN?'あなたの勝ち！':`${foeName(set.lv,foeIdx)}の勝ち…`;
  else t=`${who(w)}の勝ち！`;
  $('wtxt').textContent=t;
  $('wsub').textContent=`${PNAME[1]} ${a} − ${b} ${PNAME[2]}`;
  say('ゲーム終了');
  if(set.mode==='cpu'&&w&&w!==HUMAN){
    $('loseImg').src=LOSE_IMG[HUMAN];
    $('loseSub').textContent=`${PNAME[1]} ${a} − ${b} ${PNAME[2]}（${foeName(set.lv,foeIdx)}の勝ち）`;
    $('lose').hidden=false;$('loseAgain').focus();
  }else $('over').classList.add('show');
}
function undo(){
  if(busy||!hist.length)return;
  let h=hist.pop();
  if(set.mode==='cpu'){while(h.turn!==HUMAN&&hist.length)h=hist.pop();if(h.turn!==HUMAN)return newGame()}
  B=h.B;turn=h.turn;last=h.last;
  $('over').classList.remove('show');
  render();say(`${who(turn)}の番です`);startNag();
}
$('reset').addEventListener('click',startOrder);
$('again').addEventListener('click',()=>{if(set.foe<0)pickFoe();startOrder()});
$('undo').addEventListener('click',undo);
$('loseAgain').addEventListener('click',()=>{$('lose').hidden=true;if(set.foe<0)pickFoe();startOrder()});
$('loseTitle').addEventListener('click',toTitle);
$('hint').addEventListener('click',e=>{
  showHint=!showHint;
  e.currentTarget.textContent='置ける場所：'+(showHint?'表示':'非表示');
  e.currentTarget.setAttribute('aria-pressed',String(showHint));
  render();
});
pickFoe();drawMenu();
/* 勝利画面のテスト表示：URLの末尾に #win-test */
function winTest(){
  set.mode='cpu';drawMenu();
  $('menu').hidden=true;$('janken').hidden=true;$('dice').hidden=true;$('game').hidden=false;
  newGame(set.side);clearTimeout(cpuTimer);busy=false;
  SQ.forEach((q,i)=>B[q]=(i*7)%10<7?HUMAN:3-HUMAN);
  render();finish();
}
if(location.hash==='#win-test')winTest();
addEventListener('hashchange',()=>{if(location.hash==='#win-test')winTest()});
window.__srb={chooseMove,buildAI,newBoard,genMoves,doMove,count,SQ};
}
